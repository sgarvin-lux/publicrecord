name: Geocode Providers

on:
  schedule:
    # Run daily at 2:15am UTC (after provider ingestion at 2am)
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  geocode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Geocode provider addresses
        run: npx tsx scripts/geocode-providers.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
